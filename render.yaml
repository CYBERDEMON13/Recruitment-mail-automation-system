services:
  - type: web
    name: recruitment-email-automation
    env: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: SMTP_HOST
        value: api.resend.com
      - key: SMTP_PORT
        value: 443
      - key: SMTP_SECURE
        value: true
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      - key: SENDER_NAME
        value: HR Recruitment Team
      - key: SMTP_USER
        value: vishalcharlie13@gmail.com
      - key: SMTP_PASS
        sync: false
